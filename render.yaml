services:
  - type: worker
    name: minestrator-bot
    env: node
    buildCommand: npm install && node_modules/.bin/puppeteer browsers install chrome
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: MINESTRATOR_EMAIL
        sync: false
      - key: MINESTRATOR_PASSWORD
        sync: false
      - key: SERVER_URL
        sync: false

